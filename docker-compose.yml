services:
  eventia:
    build: .
    image: eventia:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/eventia.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Eventia2026!}
    volumes:
      - eventia-data:/app/data
    restart: unless-stopped

volumes:
  eventia-data:
